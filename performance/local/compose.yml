# Local phase: the VM stack plus stand-ins for Azure Flexible Server and the external broker.
#   docker compose -f performance/local/compose.yml --env-file performance/.env --profile seed up --no-start
#   docker compose -f performance/local/compose.yml --env-file performance/.env up -d database mqtt
name: senswave-perf

include:
  - path: ../stack/compose.yml
    # alloy-defaults.env.local first: local-only placeholders so Alloy starts without Grafana Cloud; performance/.env wins when it sets them.
    env_file: [ ./alloy-defaults.env.local, ../.env ]

services:
  database:
    image: postgres:18.6
    container_name: Senswave.Perf.Database
    # The API's Npgsql pool may open 250 connections under overload (PostgreSql__MaxPoolSize in stack/compose.yml); with
    # the agent, health checks and the seed on top, the default max_connections of 100 is exhausted ("too many clients").
    command: [ "postgres", "-c", "max_connections=400" ]
    cpuset: ${SIDE_CPUSET:-0-1}
    networks: [ perf ]
    ports: [ "127.0.0.1:5432:5432" ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - perf-database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 15

  mqtt:
    image: eclipse-mosquitto:2.0.21
    container_name: Senswave.Perf.Mqtt
    cpuset: ${SIDE_CPUSET:-0-1}
    networks: [ perf ]
    ports: [ "127.0.0.1:1883:1883", "127.0.0.1:8883:8883" ]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${CERT_DIR:-../../docker/https}:/mosquitto/certs:ro

volumes:
  perf-database-data:
